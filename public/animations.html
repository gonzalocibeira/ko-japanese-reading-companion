<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kōくん — A little gallery</title>
<style>
body{margin:0;background:#dfd0ae;color:var(--ink,#242b2d);font:14px/1.6 var(--body,system-ui)}
main{max-width:940px;margin:40px auto;padding:0 24px 32px}
header{margin-bottom:28px;text-align:center}
h1{margin:0;color:#163c4d;font:600 32px/1.3 Georgia,"Yu Mincho",serif}
header p{margin:6px 0 0;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
figure{margin:0;padding:10px 6px 14px;text-align:center;background:var(--paper,#f4ecd8);border:1px solid #263d4638;box-shadow:2px 3px 0 #263d460a}
canvas{display:block;width:128px;height:128px;margin:0 auto}
figcaption{font-size:12px;color:#535a5b}
#status{text-align:center;color:var(--muted)}
#status:empty{display:none}
@media(max-width:380px){main{padding:0 14px 24px}.gallery{gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}canvas{width:112px;height:112px}}
</style>
</head>
<body>
<main>
<header><h1>Kōくん</h1><p>A little gallery.</p></header>
<div class="gallery" aria-label="Kōくん animations"></div>
<p id="status" role="status">Waking up the gallery…</p>
</main>
<script src="animations.js"></script>
</body>
</html>
