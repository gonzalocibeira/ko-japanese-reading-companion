<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playgrounds — Kō</title>
<style>
html{height:100%;background:var(--surface,#e6d8b9)}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;color:var(--ink,#242b2d);font:15px/1.6 var(--body,system-ui)}
header{display:flex;align-items:center;gap:16px;padding:18px 24px;border-bottom:3px solid var(--line);background:var(--paper)}
header img{width:44px;height:44px;flex:none}header div{flex:1;min-width:0}h1{font:800 22px/1.3 var(--mono,monospace);margin:0}header p{font-size:12px;color:var(--muted);margin:4px 0 0}header a{font-size:12px;color:var(--accent);flex:none;text-underline-offset:3px}
main{flex:1;min-height:0;width:100%;max-width:960px;margin:0 auto;background:var(--paper);border-inline:1px solid var(--line)}
button{font:700 12px/1.4 var(--body);padding:8px 10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}button:hover{background:var(--surface)}
.playground-selection{width:100%;max-width:680px;margin-inline:auto}.loading{margin:24px}
@media(max-width:440px){header{padding:14px;gap:10px}header img{width:32px;height:32px}h1{font-size:18px}header p{font-size:11px}header a{font-size:11px}main{border:0}}
</style>
</head>
<body>
<header><img src="icons/logo.svg" alt="Kō"><div><h1>Playgrounds</h1><p>Explore Japanese words and expressions offline.</p></div><a href="about.html" target="_blank" rel="noopener noreferrer">About Kō</a></header>
<main id="playground-host"><p class="loading" role="status">Opening playgrounds…</p></main>
<script src="playgrounds.js"></script>
</body>
</html>
